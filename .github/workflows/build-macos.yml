name: oaCapture on macOS 27 arm64

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install autoconf automake autoconf-archive libtool pkgconf \
            qt@5 cfitsio libtiff libpng jpeg-turbo libraw xz \
            libdc1394 libftdi yasm
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ./bootstrap
          CFLAGS='-O2 -std=gnu17' ./configure --disable-maintainer-mode

      - name: Build
        run: make -j2

      - name: Verify Apple silicon binary
        run: |
          file oacapture/oacapture
          test "$(lipo -archs oacapture/oacapture)" = arm64
