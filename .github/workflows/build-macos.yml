name: oaCapture on macOS 27 arm64

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          brew install autoconf automake autoconf-archive libtool pkgconf \
            qt@5 cfitsio libtiff libpng jpeg-turbo libraw xz \
            libdc1394 libftdi yasm
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ./bootstrap
          CFLAGS='-O2 -std=gnu17' ./configure --disable-maintainer-mode

      - name: Build
        run: make -j2

      - name: Verify Apple silicon binary
        run: |
          file oacapture/oacapture
          test "$(lipo -archs oacapture/oacapture)" = arm64

      - name: Package oaCapture app
        run: |
          app="dist/oaCapture.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/translations"
          cp oacapture/oacapture "$app/Contents/MacOS/oaCapture"
          cp osx/oacapture.plist "$app/Contents/Info.plist"
          cp osx/oaCapture.icns "$app/Contents/Resources/"
          cp oacapture/translations/*.qm "$app/Contents/Resources/translations/"
          plutil -lint "$app/Contents/Info.plist"
          "$(brew --prefix qt@5)/bin/macdeployqt" "$app" -verbose=2
          otool -L "$app/Contents/MacOS/oaCapture"
          ditto -c -k --keepParent "$app" dist/oaCapture-macos27-arm64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: oaCapture-macos27-arm64
          path: dist/oaCapture-macos27-arm64.zip
          if-no-files-found: error
